name: Lock Refresh Artifact

on:
  push:
    branches: ["feat/stage-7d-gmail-analysis"]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-7d-gmail-analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lock for patched sharp"
          git push origin HEAD:feat/stage-7d-gmail-analysis
