name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Docker Compose non-root identity
        run: |
          cp .env.example .env
          ASSISTANT_UID="$(id -u)" ASSISTANT_GID="$(id -g)" docker compose config >/dev/null

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: assistant-ci:stage4b
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke local PDF/OCR tooling
        run: >-
          docker run --rm --platform ${{ matrix.platform }} assistant-ci:stage4b sh -lc
          'pdfinfo -v && pdftotext -v && pdftoppm -v && tesseract --version &&
          tesseract --list-langs | grep -qx eng && tesseract --list-langs | grep -qx spa'
      - name: Smoke writable bind-mounted data as host identity
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm --platform ${{ matrix.platform }} \
            --user "${uid}:${gid}" \
            -v "$PWD/data:/app/data" \
            assistant-ci:stage4b \
            sh -lc 'touch /app/data/.bind-write-smoke && rm /app/data/.bind-write-smoke'
